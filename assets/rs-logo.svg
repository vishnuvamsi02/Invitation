  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4da" />
      <stop offset="35%" stop-color="#f5d99d" />
      <stop offset="70%" stop-color="#d9a34b" />
      <stop offset="100%" stop-color="#9a6723" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce8f34" />
      <stop offset="50%" stop-color="#fff2d7" />
      <stop offset="100%" stop-color="#d9a34b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

