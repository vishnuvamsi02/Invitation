  <!-- Inner Delicate Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="250" cy="250" r="166" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Top Crown / Kalash Motif -->
  <g transform="translate(250, 92) scale(0.9)">
    <path d="M0 -18 C-8 -8 -12 2 0 12 C12 2 8 -8 0 -18 Z" fill="url(#goldShine)" filter="url(#glow)" />
    <path d="M-14 2 C-22 8 -18 16 -6 18 C-10 12 -8 6 -14 2 Z" fill="url(#goldGrad)" />
    <path d="M14 2 C22 8 18 16 6 18 C10 12 8 6 14 2 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-22" r="3.5" fill="#fff4da" />
  </g>

  <!-- Central Interlocking Monogram: R & S -->
  <g id="monogram" text-anchor="middle" dominant-baseline="central">
    <!-- 'R' -->
    <text x="210" y="240" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="145" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">R</text>
    
    <!-- '&' amp -->
    <text x="250" y="258" font-family="'Cinzel', serif" font-size="44" font-weight="600" fill="url(#goldShine)" opacity="0.95">&amp;</text>
    
    <!-- 'S' -->
    <text x="290" y="275" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="145" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">S</text>
  </g>

  <!-- Lower Curved Ribbon / Text -->
  <path id="textArc" d="M 120 340 A 155 155 0 0 0 380 340" fill="none" stroke="none" />
  <text fill="url(#goldShine)" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" letter-spacing="0.32em">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      RAVI &amp; SOWJANAYA • 2026
    </textPath>
  </text>

  <!-- Bottom Lotus Accent -->
  <g transform="translate(250, 395) scale(0.8)">
