<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6dd" />
      <stop offset="25%" stop-color="#f5d99d" />
      <stop offset="65%" stop-color="#d9a34b" />
      <stop offset="100%" stop-color="#a87126" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c88b30" />
      <stop offset="50%" stop-color="#fff8e7" />
      <stop offset="100%" stop-color="#d9a34b" />
    </linearGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ec6" />
      <stop offset="45%" stop-color="#f3729e" />
      <stop offset="85%" stop-color="#c94474" />
      <stop offset="100%" stop-color="#8a1f47" />
    </linearGradient>
    <linearGradient id="lotusCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffebaa" />
      <stop offset="70%" stop-color="#f09cb8" />
      <stop offset="100%" stop-color="#b83864" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ornate Mandala Halo -->
  <g transform="translate(200, 160)" filter="url(#softGlow)">
    <!-- Sunburst Rays -->
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(0)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(11.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(22.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(33.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(45)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(56.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(67.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(78.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(90)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(101.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(112.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(123.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(135)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(146.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(157.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(168.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(180)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(191.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(202.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(213.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(225)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(236.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(247.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(258.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(270)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(281.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(292.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(303.75)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(315)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(326.25)" opacity="0.6" />
    
      <line x1="0" y1="-78" x2="0" y2="-92" stroke="url(#gold)" stroke-width="2" transform="rotate(337.5)" opacity="0.9" />
    
      <line x1="0" y1="-78" x2="0" y2="-86" stroke="url(#gold)" stroke-width="1.2" transform="rotate(348.75)" opacity="0.6" />
    

    <!-- Concentric Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#gold)" stroke-width="2" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />
    <circle cx="0" cy="0" r="54" fill="rgba(32, 14, 40, 0.75)" stroke="url(#gold)" stroke-width="1.8" />

    <!-- Central Monogram: R & S -->
    <text x="-12" y="10" font-family="'Cinzel', serif" font-size="34" font-weight="700" fill="url(#goldGlow)" text-anchor="middle">R</text>
    <text x="3" y="4" font-family="'Cormorant Garamond', serif" font-size="18" font-style="italic" fill="url(#gold)" text-anchor="middle" opacity="0.85">&amp;</text>
    <text x="18" y="10" font-family="'Cinzel', serif" font-size="34" font-weight="700" fill="url(#goldGlow)" text-anchor="middle">S</text>
  </g>

  <!-- Side Vines & Floral Scrolls -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.4" opacity="0.85">
    <path d="M 125 160 C 110 120 120 80 150 65 C 135 90 145 125 130 160" />
    <path d="M 275 160 C 290 120 280 80 250 65 C 265 90 255 125 270 160" />
    <!-- Buds -->
    <circle cx="122" cy="115" r="3.5" fill="url(#lotusPink)" stroke="none" />
    <circle cx="278" cy="115" r="3.5" fill="url(#lotusPink)" stroke="none" />
  </g>

  <!-- Blooming Lotus Base -->
  <g transform="translate(200, 240)">
    <!-- Back Petals -->
    <path d="M 0 5 C -40 -10 -65 -35 -55 -60 C -40 -40 -15 -25 0 5 Z" fill="url(#lotusPink)" opacity="0.85" />
    <path d="M 0 5 C 40 -10 65 -35 55 -60 C 40 -40 15 -25 0 5 Z" fill="url(#lotusPink)" opacity="0.85" />
    <path d="M 0 5 C -25 -20 -40 -50 -30 -75 C -15 -50 0 -30 0 5 Z" fill="url(#lotusPink)" opacity="0.9" />
    <path d="M 0 5 C 25 -20 40 -50 30 -75 C 15 -50 0 -30 0 5 Z" fill="url(#lotusPink)" opacity="0.9" />
    <!-- Center Front Petal -->
    <path d="M 0 5 C -18 -30 -18 -65 0 -85 C 18 -65 18 -30 0 5 Z" fill="url(#lotusCenter)" stroke="url(#gold)" stroke-width="1" />
    <!-- Front Side Petals -->
    <path d="M 0 5 C -20 -15 -45 -25 -50 -45 C -35 -35 -15 -15 0 5 Z" fill="url(#lotusCenter)" />
    <path d="M 0 5 C 20 -15 45 -25 50 -45 C 35 -35 15 -15 0 5 Z" fill="url(#lotusCenter)" />
    <!-- Lotus Pedestal base -->
    <ellipse cx="0" cy="5" rx="22" ry="4" fill="url(#gold)" />
  </g>

  <!-- Arched Subtitle Text -->
  <g text-anchor="middle">
    <text x="200" y="295" font-family="'Cinzel', serif" font-size="12" font-weight="700" letter-spacing="0.22em" fill="url(#goldGlow)">
      RAVI &amp; SOWJANAYA
    </text>
    <text x="200" y="315" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.25em" fill="url(#gold)" opacity="0.85">
      — TWO SOULS, ONE ETERNAL BOND —
    </text>
  </g>
</svg>